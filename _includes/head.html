<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title | downcase | strip_html }} · {% endif %}{{ site.title }}</title>
  {% assign description = page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 %}
  {% if description != "" %}<meta name="description" content="{{ description | escape }}">{% endif %}
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ff8700'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
</head>
