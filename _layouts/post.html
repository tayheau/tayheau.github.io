---
layout: base
---
{% include liquid_count_functions.html %}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ 
    startOnLoad: true,
    securityLevel: 'loose'
  });
</script>
<script defer src="https://mathjax.rstudio.com/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
<div class="post-header">
	<h1 class="post-title">
		<span>
			[{{ page.date | date: "%b %y" | downcase }}]
		</span>
		{{ page.title | downcase }}
	</h1>
	<p class="post-meta">
		{{ word_count }} words · {{ reading_time }} min
	</p>
</div>
<div id="post-content">
	{{ content }}
</div>
